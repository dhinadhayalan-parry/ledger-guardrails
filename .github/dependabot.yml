# Keeps pinned dependencies current. Every update arrives as a pull request
# and passes the same policy gate as any other change.
#
# The cooldown delays adoption of a new release by a week, so a compromised or
# broken release is usually yanked before it is proposed here.
#
# Not covered: the toolchain pinned in scripts/install_tools.sh (OPA, conftest,
# gator, Terraform), which is versioned and checksummed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  - package-ecosystem: terraform
    directories:
      - /infra/envs/sandbox
      - /examples/noncompliant
      - /governance/github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      providers:
        patterns: ["*"]
    commit-message:
      prefix: deps
