apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sledgerprivileged
  annotations:
    ledger.io/controls: LG-K8S-02
    description: >-
      Denies privileged containers, containers that do not explicitly disable
      privilege escalation, pods that share host namespaces, added Linux
      capabilities other than NET_BIND_SERVICE, hostPath volumes, and
      containers that may run as root (runAsNonRoot not true for the
      container, or runAsUser 0). Covers containers, initContainers and
      ephemeralContainers; container settings override pod settings.
spec:
  crd:
    spec:
      names:
        kind: K8sLedgerPrivileged
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sledgerprivileged

        host_namespace_fields := {"hostPID", "hostIPC", "hostNetwork"}

        violation[{"msg": msg}] {
          c := input_containers[_]
          c.securityContext.privileged == true
          msg := sprintf("[LG-K8S-02] container %q must not be privileged", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not escalation_disabled(c)
          msg := sprintf("[LG-K8S-02] container %q must set securityContext.allowPrivilegeEscalation: false", [c.name])
        }

        violation[{"msg": msg}] {
          field := host_namespace_fields[_]
          input.review.object.spec[field] == true
          msg := sprintf("[LG-K8S-02] pod must not set spec.%v", [field])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          capability := c.securityContext.capabilities.add[_]
          not allowed_capability(capability)
          msg := sprintf("[LG-K8S-02] container %q must not add capability %v; only NET_BIND_SERVICE is allowed", [c.name, capability])
        }

        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          msg := sprintf("[LG-K8S-02] volume %q must not use hostPath", [volume.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not runs_as_non_root(c)
          msg := sprintf("[LG-K8S-02] container %q must run as non-root (securityContext.runAsNonRoot: true)", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          run_as_user(c) == 0
          msg := sprintf("[LG-K8S-02] container %q must not run as UID 0 (runAsUser: 0)", [c.name])
        }

        escalation_disabled(c) {
          c.securityContext.allowPrivilegeEscalation == false
        }

        # Accepts NET_BIND_SERVICE in any case, with or without the CAP_ prefix.
        allowed_capability(capability) {
          trim_prefix(upper(capability), "CAP_") == "NET_BIND_SERVICE"
        }

        pod_security_context := object.get(input.review.object.spec, "securityContext", {})

        # The container's own setting wins; the pod's applies only when the
        # container does not set the field (absent or null, never both).
        effective(c, field) = value {
          value := c.securityContext[field]
          value != null
        }

        effective(c, field) = value {
          object.get(c, ["securityContext", field], null) == null
          value := pod_security_context[field]
        }

        runs_as_non_root(c) {
          effective(c, "runAsNonRoot") == true
        }

        run_as_user(c) = uid {
          uid := effective(c, "runAsUser")
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
