apiVersion: v1
kind: Pod
metadata:
  name: proxy
  namespace: ledger
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: proxy
      image: crledgersandbox.azurecr.io/ledger/proxy@sha256:4f3c2b1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["NET_BIND_SERVICE", "cap_net_bind_service", "NET_ADMIN", "CAP_SYS_ADMIN"]
