apiVersion: v1
kind: Pod
metadata:
  name: log-shipper
  namespace: ledger
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: shipper
      image: crledgersandbox.azurecr.io/ledger/log-shipper@sha256:4f3c2b1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: host-root
          mountPath: /host
        - name: scratch
          mountPath: /tmp
  volumes:
    - name: host-root
      hostPath:
        path: /
    - name: scratch
      emptyDir: {}
