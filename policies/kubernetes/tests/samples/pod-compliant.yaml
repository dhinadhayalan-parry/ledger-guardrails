apiVersion: v1
kind: Pod
metadata:
  name: settlement-api
  namespace: ledger
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: migrate
      image: crledgersandbox.azurecr.io/ledger/migrate@sha256:4f3c2b1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b
      securityContext:
        allowPrivilegeEscalation: false
  containers:
    - name: api
      image: crledgersandbox.azurecr.io/ledger/settlement-api@sha256:4f3c2b1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
