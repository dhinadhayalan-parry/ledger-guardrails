apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sLedgerPrivileged
metadata:
  name: ledger-deny-privileged
  annotations:
    ledger.io/controls: LG-K8S-02
spec:
  # Rollout: dryrun (audit only) -> warn -> deny. Admission is enforced at the
  # Pod level so every controller is covered; the trade-off is that a rejected
  # Deployment surfaces as a ReplicaSet event rather than a kubectl error.
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
